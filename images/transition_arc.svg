<svg viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">The three-book journey</title>
  <desc id="desc">A progression from Menarche, to Rising Moon, to the third certificate.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#FFF7F7"/><stop offset=".52" stop-color="#F5FAFF"/><stop offset="1" stop-color="#FBF5FF"/></linearGradient>
    <linearGradient id="rose" x2="1" y2="1"><stop stop-color="#F47A8E"/><stop offset="1" stop-color="#D94465"/></linearGradient>
    <linearGradient id="blue" x2="1" y2="1"><stop stop-color="#65B5F2"/><stop offset="1" stop-color="#3975D0"/></linearGradient>
    <linearGradient id="violet" x2="1" y2="1"><stop stop-color="#B77BD4"/><stop offset="1" stop-color="#7B3FA1"/></linearGradient>
    <linearGradient id="path" x2="1"><stop stop-color="#E85D75"/><stop offset=".5" stop-color="#4A90D9"/><stop offset="1" stop-color="#9B59B6"/></linearGradient>
    <filter id="shadow" x="-35%" y="-35%" width="170%" height="180%"><feDropShadow dy="8" stdDeviation="8" flood-color="#27324A" flood-opacity=".16"/></filter>
    <filter id="soft" x="-20%" y="-40%" width="140%" height="180%"><feDropShadow dy="3" stdDeviation="5" flood-color="#27324A" flood-opacity=".1"/></filter>
  </defs>
  <rect width="900" height="320" rx="24" fill="url(#bg)"/>
  <path d="M30 1H870Q899 1 899 30" fill="none" stroke="#FFF" stroke-opacity=".8" stroke-width="2"/>
  <g font-family="Inter,Avenir,Arial,sans-serif" text-anchor="middle">
    <text x="450" y="43" font-size="14" font-weight="700" letter-spacing="2.2" fill="#8B5A72">THE THREE-BOOK JOURNEY</text>
    <text x="450" y="70" font-size="16" fill="#4B5263">Your role shifts at each stage: instruction, then partnership, then trust.</text>
    <rect x="140" y="153" width="620" height="8" rx="4" fill="#E5E8EF"/>
    <rect x="140" y="153" width="620" height="8" rx="4" fill="url(#path)" opacity=".84"/>
    <path d="M758 145l14 12-14 12z" fill="#8B4BA8"/>
    <g filter="url(#soft)">
      <rect x="91" y="244" width="178" height="44" rx="14" fill="#FFF"/>
      <rect x="361" y="244" width="178" height="44" rx="14" fill="#FFF" stroke="#4A90D9" stroke-width="1.5"/>
      <rect x="631" y="244" width="178" height="44" rx="14" fill="#FFF"/>
    </g>
    <g filter="url(#shadow)">
      <circle cx="180" cy="157" r="62" fill="#FFF"/><circle cx="180" cy="157" r="55" fill="url(#rose)"/>
      <circle cx="450" cy="157" r="75" fill="#FFF"/><circle cx="450" cy="157" r="68" fill="url(#blue)"/>
      <circle cx="720" cy="157" r="62" fill="#FFF"/><circle cx="720" cy="157" r="55" fill="url(#violet)"/>
    </g>
    <g font-size="13" font-weight="800">
      <circle cx="135" cy="116" r="15" fill="#FFF"/><text x="135" y="121" fill="#D94465">1</text>
      <circle cx="393" cy="105" r="16" fill="#FFF"/><text x="393" y="110" fill="#3975D0">2</text>
      <circle cx="675" cy="116" r="15" fill="#FFF"/><text x="675" y="121" fill="#7B3FA1">3</text>
    </g>
    <text x="180" y="153" font-size="15" font-weight="800" letter-spacing=".6" fill="#FFF">MENARCHE</text>
    <text x="180" y="176" font-size="12" fill="#FFF" opacity=".92">Walking Beside Her</text>
    <text x="450" y="149" font-size="17" font-weight="800" letter-spacing=".7" fill="#FFF">RISING MOON</text>
    <text x="450" y="174" font-size="13" fill="#FFF">Module 1</text>
    <rect x="411" y="185" width="78" height="22" rx="11" fill="#FFF" opacity=".2"/>
    <text x="450" y="200" font-size="10" font-weight="700" letter-spacing=".8" fill="#FFF">YOU ARE HERE</text>
    <text x="720" y="150" font-size="14" font-weight="800" letter-spacing=".8" fill="#FFF">THIRD</text>
    <text x="720" y="171" font-size="14" font-weight="800" letter-spacing=".5" fill="#FFF">CERTIFICATE</text>
    <g font-size="11" font-weight="800" letter-spacing="1.2">
      <text x="180" y="262" fill="#C44A65">BOOK ONE</text><text x="450" y="262" fill="#3975D0">BOOK TWO</text><text x="720" y="262" fill="#8147A1">BOOK THREE</text>
    </g>
    <g font-size="10" fill="#858A99">
      <text x="180" y="278">Instruction</text><text x="450" y="278" fill="#68758B">Partnership</text><text x="720" y="278">Unlocks · Trust</text>
    </g>
  </g>
</svg>
